name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the python3 that ships with macOS, so that is where the floor is tested.
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: macos-latest, python: "3.9"}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch the sandbox image (Linux runners have Docker)
        if: runner.os == 'Linux'
        run: docker pull python:3.12-slim
      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: The trial tests really ran in a container
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p "test_trial.py" -v 2>&1 | tee trial.log && grep -q "test_isolation_holds_and_the_thief_is_caught.*ok" trial.log && grep -q "test_the_same_fences_hold_with_no_image_downloaded.*ok" trial.log
      - name: The tool passes its own check
        run: python skill-rentgen/skills/skill-rentgen/scripts/skill_rentgen.py scan skill-rentgen --lang en --out "${{ runner.temp }}/self"
      - name: No bytecode is committed
        run: test -z "$(git ls-files | grep -E '__pycache__|\.pyc$' || true)"

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A good skill passes
        id: good
        uses: ./
        with:
          path: examples/meeting-notes
          sarif: ${{ runner.temp }}/good.sarif
      - name: A bad skill fails the step
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: examples/pdf-tools
      - name: Both came out as expected
        env:
          GOOD: ${{ steps.good.outputs.verdict }}
          BAD: ${{ steps.bad.outputs.verdict }}
          BAD_OUTCOME: ${{ steps.bad.outcome }}
        run: |
          test "$GOOD" = approve
          test "$BAD" = blocked
          test "$BAD_OUTCOME" = failure
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["version"] == "2.1.0"' "$RUNNER_TEMP/good.sarif"
